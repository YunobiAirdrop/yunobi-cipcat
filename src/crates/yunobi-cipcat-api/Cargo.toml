[package]
name = "yunobi-cipcat-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The Yunobi Cipcat API: one dispatcher for projects, edits, media, effects, templates, exports and frames, which every transport - the command line, a daemon, a plugin - calls."

[dependencies]
yunobi-cipcat-core.workspace = true
yunobi-cipcat-project.workspace = true
yunobi-cipcat-effects.workspace = true
yunobi-cipcat-export.workspace = true
yunobi-cipcat-host.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
# The frame method hands back a PNG: the one picture format every
# caller reads and that keeps the compositor's pixels exact.
png = "0.17"
# A frame handed back inline crosses as text.
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
